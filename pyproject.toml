[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gastos"
version = "0.1.0"
description = "CLI para registrar gastos personales"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gastos = "gastos.cli:main"

[tool.setuptools]
packages = ["gastos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
